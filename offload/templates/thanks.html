<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're on the list — {{ brand }}</title>
<style>
  :root { --paper:#F3F5F4; --surface:#EAEEEC; --ink:#182527; --ink-muted:#55676A;
    --hairline:#D3DBD8; --accent:#1F7565;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  @media (prefers-color-scheme: dark){ :root { --paper:#0E1517; --surface:#141F22; --ink:#E7EDEB;
    --ink-muted:#93A3A1; --hairline:#24322F; --accent:#56BBA4; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper);
    color:var(--ink); font-family:var(--sans); line-height:1.6; padding:24px; }
  .card { max-width:520px; text-align:center; }
  .tick { width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff;
    display:grid; place-items:center; margin:0 auto 24px; font-size:28px; }
  h1 { font-family:var(--serif); font-weight:500; font-size:34px; margin:0 0 14px; letter-spacing:-.01em; }
  p { color:var(--ink-muted); margin:0 auto 26px; max-width:42ch; }
  a.back { color:var(--accent); text-decoration:none; font-weight:600; font-size:15px;
    border:1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius:12px; padding:12px 22px; display:inline-block; }
  a.back:hover { background:color-mix(in srgb, var(--accent) 10%, transparent); }
</style>
</head>
<body>
  <div class="card">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>You're on the list.</h1>
    <p>Thanks for joining the {{ brand }} waitlist. We'll email you the moment early access opens — no spam, no noise.</p>
    <a class="back" href="/">← Back to {{ brand|lower }}</a>
  </div>
</body>
</html>
