# Render.com blueprint — one-click deploy of the lead-capture landing page.
# In Render: New > Blueprint > point at this repo. Set the email-provider
# secrets in the dashboard (they are sync:false below).
services:
  - type: web
    name: audit-landing
    runtime: python
    plan: starter
    buildCommand: pip install -r landing/requirements.txt
    startCommand: gunicorn landing.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: leads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LEADS_PATH
        value: /data/leads.csv
      - key: EMAIL_PROVIDER
        value: ""              # set to "mailchimp" or "mailerlite" to enable
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_LIST_ID
        sync: false
      - key: MAILCHIMP_TAG
        value: audit-lead
      - key: MAILERLITE_API_KEY
        sync: false
      - key: MAILERLITE_GROUP_ID
        sync: false
