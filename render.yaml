# Render.com blueprint — one-click deploy of the lead-capture landing page.
# In Render: New > Blueprint > point at this repo. Set the email-provider
# secrets in the dashboard (they are sync:false below).
services:
  - type: web
    name: audit-landing
    runtime: python
    plan: starter
    buildCommand: pip install -r landing/requirements.txt
    startCommand: gunicorn landing.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: leads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: LEADS_PATH
        value: /data/leads.csv
      - key: EMAIL_PROVIDER
        value: ""              # set to "mailchimp" or "mailerlite" to enable
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_LIST_ID
        sync: false
      - key: MAILCHIMP_TAG
        value: audit-lead
      - key: MAILERLITE_API_KEY
        sync: false
      - key: MAILERLITE_GROUP_ID
        sync: false

  # Offload — waitlist landing page (separate product, separate service).
  - type: web
    name: offload-waitlist
    runtime: python
    plan: starter
    buildCommand: pip install -r offload/requirements.txt
    startCommand: gunicorn offload.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: offload-signups
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SIGNUPS_PATH
        value: /data/signups.csv
      - key: OFFLOAD_BRAND
        value: "Offload"        # rename the product here (or in offload/app.py)
      - key: EMAIL_PROVIDER
        value: ""               # set to "mailchimp" or "mailerlite" to enable
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: MAILCHIMP_LIST_ID
        sync: false
      - key: MAILCHIMP_TAG
        value: offload-waitlist
      - key: MAILERLITE_API_KEY
        sync: false
      - key: MAILERLITE_GROUP_ID
        sync: false

  # MediaFetch — installable reel-downloader PWA (optional Stripe paywall).
  - type: web
    name: mediafetch
    runtime: python
    plan: starter
    rootDir: mediafetch
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_SECRET
        generateValue: true       # Render generates a random signing secret
      - key: STRIPE_SECRET_KEY
        sync: false               # set to enable the paywall
      - key: STRIPE_PRICE_ID
        sync: false               # subscription price id
      - key: APP_BASE_URL
        sync: false               # your public mediafetch URL
      # Accounts tier (optional): cross-device login via Supabase + Stripe.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
