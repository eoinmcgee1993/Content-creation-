name: Deploy CRF Builder site to Netlify

# The push trigger is deliberately off. NETLIFY_AUTH_TOKEN was revoked, so every
# run since has failed, and nine red builds in a row train you to ignore the one
# that matters. Deploys are being done by hand in the meantime.
#
# To turn this back on: create a new personal access token in Netlify (User
# settings -> Applications -> Personal access tokens), save it as the
# NETLIFY_AUTH_TOKEN repository secret, run this workflow once from the Actions
# tab to confirm it is green, then uncomment the push block below.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "crf-builder/**"
  #     - ".github/workflows/deploy-ecu-app.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to Netlify
        # --no-build: this is a static folder, and without it the CLI would run
        # the root netlify.toml build (trading-dashboard) before uploading.
        run: npx netlify-cli@latest deploy --dir=crf-builder --prod --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ca431dfc-8aa8-4e51-ab98-8765e101e3a0
