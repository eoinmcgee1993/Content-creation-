name: Deploy CRF ECU Template Builder to Netlify

on:
  push:
    branches: [main]
    paths:
      - "ecu-templates/app/**"
      - ".github/workflows/deploy-ecu-app.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to Netlify
        run: npx netlify-cli@latest deploy --dir=ecu-templates/app --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ca431dfc-8aa8-4e51-ab98-8765e101e3a0
