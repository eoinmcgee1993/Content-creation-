name: landing

on:
  push:
    paths:
      - "landing/**"
      - "audits/**"
      - ".github/workflows/landing.yml"
  pull_request:
    paths:
      - "landing/**"
      - "audits/**"
      - ".github/workflows/landing.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r landing/requirements.txt
      - name: Run landing test suite
        run: pytest landing/tests -q
      - name: Smoke-test freebie generation
        run: |
          python -c "from landing.freebie import build_freebie; \
            print(build_freebie('landing/static'))"
          test -f landing/static/sample-audit-report.pd

          control + space
