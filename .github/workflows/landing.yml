name: landing

on:
  push:
    paths:
      - "landing/**"
      - "audits/**"
      - ".github/workflows/landing.yml"
  pull_request:
    paths:
      - "landing/**"
      - "audits/**"
      - ".github/workflows/landing.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r landing/requirements.txt
      - name: Run landing test suite
        run: pytest landing/tests -q
      - name: Smoke-test freebie generation
        run: |
          python -c "from landing.freebie import build_freebie; \
            print(build_freebie('landing/static'))"
          test -f landing/static/sample-audit-report.pdf
