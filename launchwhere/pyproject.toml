[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "launchwhere"
version = "1.0.0"
description = "Find the best platforms to launch your product and generate platform-specific copy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0.0",
]

[project.scripts]
launchwhere = "launchwhere.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
