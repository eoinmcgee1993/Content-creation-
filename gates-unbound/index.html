<!doctype html>
<html lang="en" class="bg-zinc-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gates Unbound — Transmission</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="antialiased">
  <main class="max-w-3xl mx-auto p-8">
    <section>
      <form id="intercept-form" class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-3">
          <input id="email" name="email" type="email" required autocomplete="email"
                 placeholder="operator@domain.com"
                 class="mono flex-1 bg-zinc-950 border border-zinc-800 focus:border-green-500 focus:ring-0 outline-none px-4 py-3 text-zinc-100 placeholder-zinc-600 rounded-md transition" />
          <button type="submit"
                  class="mono font-bold bg-green-500 hover:bg-green-400 text-black px-6 py-3 rounded-md transition active:scale-[0.98] whitespace-nowrap">
            DECRYPT 001
          </button>
        </div>
        <p id="form-status" class="mono text-xs h-4" aria-live="polite"></p>
      </form>
    </section>

    <footer class="mono text-[10px] text-zinc-600 mt-16 pt-6 border-t border-zinc-900 reveal" style="animation-delay:1.35s">
      GATES UNBOUND // EST. SIGNAL &mdash; you are the raw material, until you aren't.
    </footer>
  </main>

  <script>
    // -- Optional Supabase capture ---------------------------------------
    // Matches the repo pattern (see storefront/index.html). Fill these in to
    // persist emails to a `waitlist` table via the public anon key. Leave as
    // placeholders and the form will still route the operator to the briefing.
    const SUPABASE_URL      = "https://bznoitwdegzinwjhuoyg.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QdEUme2hCAPzcKiO2xI-ww_Y1wA69f7";
    const TRANSMISSION_URL  = "./intercept/001.html";

    const form   = document.getElementById("intercept-form");
    const status = document.getElementById("form-status");

    function configured() {
      return !SUPABASE_URL.includes("<YOUR_") && !SUPABASE_ANON_KEY.includes("<YOUR_");
    }

    // Persist now returns the fetch Response when credentials are configured.
    async function persist(email) {
      if (!configured()) return undefined; // no-op until credentials are set

      const res = await fetch(`${SUPABASE_URL}/rest/v1/waitlist`, {
        method: "POST",
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal",
        },
        body: JSON.stringify({ email, source: "transmission-001" }),
      }).catch(err => {
        // Network errors will surface here — rethrow so submit handler can react.
        console.error("Network error when contacting Supabase", err);
        throw err;
      });

      // Always return the Response object so callers can inspect res.ok/status.
      return res;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      status.className = "mono text-xs h-4 text-zinc-400";
      status.textContent = "> establishing secure connection...";
      try {
        const res = await persist(email);

        // If persist wasn't configured (undefined), continue silently.
        if (res === undefined) {
          status.className = "mono text-xs h-4 text-green-400";
          status.textContent = "> access granted. rerouting to 001...";
          setTimeout(() => { window.location.href = TRANSMISSION_URL; }, 900);
          return;
        }

        // Inspect the HTTP response — fetch resolves for 4xx/5xx so we must
        // check `ok` and react accordingly instead of assuming success.
        if (!res.ok) {
          const detail = await res.text().catch(() => "(no body)");
          console.error("Supabase insert failed", res.status, detail);

          status.className = "mono text-xs h-4 text-red-400";
          status.textContent = "> failed to record interest. please try again later.";

          // Do NOT proceed to the success routing automatically; this prevents
          // silent drops when the anon key, RLS, or schema reject the insert.
          return;
        }

        // Successful insert
        status.className = "mono text-xs h-4 text-green-400";
        status.textContent = "> access granted. rerouting to 001...";
        setTimeout(() => { window.location.href = TRANSMISSION_URL; }, 900);
      } catch (err) {
        // Capture failed (network / config) — surface an error to the operator
        // instead of silently continuing. The original behavior routed anyway
        // which could silently drop the email when the request succeeded
        // with a 4xx/5xx; with the above checks we now avoid that.
        console.error("Persist failed", err);
        status.className = "mono text-xs h-4 text-red-400";
        status.textContent = "> failed to record interest. please try again later.";
      }
    });
  </script>
</body>
</html>
