<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belle's Memory Box</title>
  <style>body { background: #0d0b09; margin: 0; }</style>
  <!-- No build step: React comes from esm.sh via the import map, and Babel
       compiles the JSX in the browser. The .jsx is fetched over HTTP, so
       this page must be served (see README), not opened as a file. -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    // Compile the component's JSX here and import the result from a blob URL;
    // the import map still resolves its bare "react" import.
    const source = await (await fetch("./BelleMemoryBox.jsx")).text();
    const { code } = Babel.transform(source, { presets: ["react"] });
    const blobUrl = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    const { default: BelleMemoryBox } = await import(blobUrl);
    createRoot(document.getElementById("root")).render(React.createElement(BelleMemoryBox));
  </script>
</body>
</html>
